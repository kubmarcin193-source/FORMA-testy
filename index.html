
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Forma PRO</title>
<meta name="theme-color" content="#38bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forma PRO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#020617;--card:#111827;--card2:#1f2937;--line:#334155;--txt:#f8fafc;--muted:#94a3b8;
  --accent:#38bdf8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--purple:#a78bfa;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#172554,#020617 58%);color:var(--txt);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#020617ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px}
h1{margin:0;font-size:23px} h2{margin:4px 0 12px} h3{margin:8px 0}
small,.muted{color:var(--muted)}
main{max-width:1100px;margin:auto;padding:12px 12px 80px}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}
.tab{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:10px 13px;white-space:nowrap;font-weight:700}
.tab.active{background:var(--accent);color:#00111c}
.card{background:linear-gradient(180deg,#111827,#0f172a);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 12px 24px #0006}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.stat{background:#1f2937;border:1px solid var(--line);border-radius:15px;padding:13px}
.stat b{font-size:25px}
label{display:block;margin:11px 0 5px;color:var(--muted)}
input,textarea,select{width:100%;border:1px solid var(--line);background:#020617;color:var(--txt);border-radius:12px;padding:12px;font-size:15px}
textarea{min-height:80px}
button{border:0;border-radius:12px;padding:11px 14px;margin:5px 5px 5px 0;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#00111c}.good{background:var(--good);color:#031407}.warn{background:var(--warn);color:#160e00}.bad{background:var(--bad);color:white}.ghost{background:#1f2937;color:var(--txt);border:1px solid var(--line)}
.progress{height:16px;background:#020617;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));width:0%}
.bigProgress{height:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.badge{display:inline-block;border:1px solid var(--line);background:#0f172a;border-radius:999px;padding:6px 9px;margin:3px;font-size:13px}
.ok{color:var(--good)}.minus{color:var(--good)}.plus{color:var(--warn)}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photoBox{background:#020617;border:1px dashed var(--line);border-radius:14px;padding:8px;text-align:center}
.photoBox img,.exerciseImg{max-width:100%;max-height:300px;border-radius:12px}
.recipe{border-left:4px solid var(--warn)}
.hidden{display:none}
.chart{width:100%;height:240px;background:#020617;border:1px solid var(--line);border-radius:14px;padding:8px}
.achievement{opacity:.4}.achievement.done{opacity:1;border-color:var(--good)}
.quickGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.calendarWrap{overflow-x:auto;padding-bottom:6px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(42px,1fr));gap:6px;min-width:340px}
.weekday{background:#020617;border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;font-size:12px;color:var(--muted);font-weight:800}
.dayCell{background:#020617;border:1px solid var(--line);border-radius:12px;min-height:70px;padding:6px;font-size:11px;position:relative}
.dayCell.training{border-color:var(--good);box-shadow:0 0 0 1px #22c55e55;background:#052e16}
.dayCell.duty{border-color:var(--warn);background:#1f1603}
.dayCell.today{border-color:var(--accent);box-shadow:0 0 0 2px #38bdf899,0 0 18px #38bdf855;background:#082f49}
.calendarNav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:8px 0 12px}
.calendarNav .navBtns{display:flex;gap:8px;flex-wrap:wrap}
.dayNum{font-size:15px;font-weight:900;display:block}
.monthMini{font-size:10px;color:var(--muted)}
.dayIcons{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;min-height:18px}
.iconPill{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:#111827;border:1px solid var(--line);font-size:12px}
.iconPill.green{border-color:var(--good);background:#064e3b}
.iconPill.yellow{border-color:var(--warn);background:#451a03}
.iconPill.red{border-color:var(--bad);background:#450a0a}
.iconPill.plan{border-color:var(--accent);background:#082f49;border-style:dashed;box-shadow:0 0 0 1px #38bdf833}
.measureGuideNote{margin-top:10px;line-height:1.45;color:var(--muted)}
.dayCell button{width:100%;font-size:10px;padding:6px 4px;margin:5px 0 0}
.dot{display:inline-block;width:9px;height:9px;background:var(--bad);border-radius:50%;margin-left:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.legend .badge{font-size:12px}
.exerciseActive{border-color:var(--accent);box-shadow:0 0 0 1px #38bdf855}
.timer{font-size:42px;font-weight:900;text-align:center;padding:10px}
.setCounter{font-size:24px;font-weight:900}
@media(max-width:650px){
 h1{font-size:20px}
 .photoGrid{grid-template-columns:1fr}
 table{font-size:12px}
 .card{padding:12px}
 .calendar{grid-template-columns:repeat(7,minmax(38px,1fr));gap:4px;min-width:0}
 .weekday{font-size:10px;padding:6px 0}
 .dayCell{min-height:62px;padding:5px 3px;border-radius:10px;font-size:10px}
 .dayNum{font-size:14px}
 .monthMini{display:none}
 .iconPill{width:18px;height:18px;font-size:11px}
 .dayIcons{gap:2px;margin-top:4px}
 .dayCell button{font-size:0;padding:6px 0}
 .dayCell button::after{content:"✎";font-size:12px}
}

/* ===== DODANE: ekran dziś, historia, karta dnia ===== */
.todayGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.todayHero{border:1px solid rgba(56,189,248,.35);background:linear-gradient(180deg,#0f172a,#082f49);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 14px 28px #0007}
.todayHero h2{font-size:24px;margin:0 0 8px}.todayHero .big{font-size:34px;font-weight:900}
.actionRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actionRow button{flex:1;min-width:150px}
.dayFullCard{border:1px solid rgba(56,189,248,.35);background:linear-gradient(180deg,#111827,#0b1220);border-radius:18px;padding:14px;margin-top:12px}
.daySummaryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.daySummaryBox{background:#020617;border:1px solid var(--line);border-radius:14px;padding:10px}
.daySummaryBox b{font-size:20px}.historyActions{display:flex;gap:6px;flex-wrap:wrap}.historyActions button{padding:8px 10px;margin:2px}
.trendMinus{color:var(--good);font-weight:900}.trendPlus{color:var(--warn);font-weight:900}.trendNeutral{color:var(--muted);font-weight:900}
.inlineForm{border:1px solid var(--line);border-radius:14px;background:#020617;padding:12px;margin-top:10px}


.install-app-btn{background:#38bdf8;color:#00111c;border:0;border-radius:12px;padding:10px 13px;margin-top:8px;font-weight:900;box-shadow:0 0 0 1px #38bdf855;}
.install-app-btn[hidden]{display:none!important;}
.pwa-debug{font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.3;}


/* ===== Forma PRO v12 ===== */
.photoTriple{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photoTriple .photoBox img{width:100%;height:260px;object-fit:contain}
.compareMeta{display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:var(--muted)}
.compareSlider{position:relative;width:100%;height:min(70vh,560px);background:#020617;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.compareSlider img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
.compareAfter{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(0 50% 0 0)}
.compareDivider{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);transform:translateX(-1px);pointer-events:none}
.compareSlider input[type=range]{position:absolute;left:0;right:0;bottom:10px;width:calc(100% - 24px);margin:0 12px;z-index:4;background:#020617cc}
.calendarFilters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.calendarFilters label{display:inline-flex;align-items:center;gap:5px;margin:0;background:#0f172a;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--txt);font-size:12px}
.calendarFilters input{width:auto;margin:0}
.iconPill{padding:0;margin:0;cursor:pointer}
.weekSummaryList{display:grid;gap:8px}
.weekSummaryRow{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;text-align:left;background:#020617;color:var(--txt);border:1px solid var(--line);width:100%;margin:0}
.weekSummaryRow span{color:var(--muted);text-align:right}.weekSummaryRow small{grid-column:1/-1}
.tableScroll{overflow:auto}
.progressHint{background:#020617;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;line-height:1.5}
.compactExerciseList{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:10px}
.compactExerciseList .stat b{font-size:17px}
.setEditorCard{border-color:var(--accent)}
.editorExercise{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#020617;border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0}
.editorExercise span{display:flex;gap:4px}.editorExercise button{padding:7px 9px;margin:0}
.backupList{display:grid;gap:8px;margin-top:10px}.backupRow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#020617;border:1px solid var(--line);border-radius:12px;padding:10px}.backupRow button{padding:8px 10px}
.badText{color:var(--bad)}
@media(max-width:650px){.photoTriple{grid-template-columns:1fr}.photoTriple .photoBox img{height:auto;max-height:360px}.compareSlider{height:58vh}.backupRow{align-items:flex-start;flex-direction:column}.weekSummaryRow{grid-template-columns:1fr}.weekSummaryRow span{text-align:left}}


/* ===== Forma PRO v14 — logowanie aplikacji ===== */
body.auth-locked{overflow:hidden}
body.auth-locked>header,body.auth-locked>main{visibility:hidden;pointer-events:none;user-select:none}
#appAuthGate{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at top,#172554,#020617 58%)}
body.auth-locked #appAuthGate{display:flex}
.authCard{width:min(430px,100%);background:linear-gradient(180deg,#111827,#0f172a);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 70px #000c;text-align:center}
.authLogo{width:74px;height:74px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:#082f49;border:1px solid #38bdf888;font-size:36px;box-shadow:0 0 30px #38bdf833}
.authCard h1{font-size:27px;margin:0 0 5px}.authCard p{line-height:1.5}.authCard label{text-align:left}
.authCard input{font-size:20px;text-align:center;letter-spacing:2px}
.authCard button{width:100%;margin:12px 0 0;font-size:16px;padding:13px}
.authMessage{min-height:22px;margin-top:10px;font-weight:800}.authMessage.error{color:var(--bad)}.authMessage.ok{color:var(--good)}
.authRule{margin-top:14px;padding:10px;border-radius:12px;background:#020617;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.45}



/* ===== Forma PRO v16 — pełnoekranowy tryb treningowy ===== */
body.workout-player-open{overflow:hidden;overscroll-behavior:none}
.workoutPlayer{position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0,#172554 0,#020617 52%);color:var(--txt);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.workoutPlayer.active{display:flex}
.workoutPlayerTop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#020617e8;backdrop-filter:blur(12px);min-height:72px}
.workoutPlayerTop strong{display:block;font-size:17px}.workoutPlayerTop small{display:block;margin-top:4px}.workoutTopActions{display:flex;gap:7px;flex-shrink:0}.workoutTopActions button{margin:0;padding:10px 12px;font-size:18px}
.workoutPlayerContent{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1fr);gap:18px;align-items:center;padding:18px;max-width:1280px;width:100%;margin:auto}
.workoutPlayerMedia{min-height:280px;height:min(58vh,650px);display:flex;align-items:center;justify-content:center;background:#020617;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 45px #0008}
.workoutPlayerMedia img{width:100%;height:100%;object-fit:contain;display:block}.workoutPlayerMedia.noImage::after{content:"Brak zdjęcia ćwiczenia";color:var(--muted);font-weight:800}.workoutPlayerMedia.noImage img{display:none}
.workoutPlayerInfo{display:flex;flex-direction:column;justify-content:center;min-width:0}.workoutPhase{align-self:flex-start;border:1px solid var(--accent);background:#082f49;color:#e0f2fe;border-radius:999px;padding:7px 11px;font-weight:900;letter-spacing:.06em;font-size:12px}.workoutPhase.rest{border-color:var(--warn);background:#451a03;color:#fef3c7}
.workoutPlayerInfo h1{font-size:clamp(30px,5vw,58px);line-height:1.05;margin:14px 0 10px;overflow-wrap:anywhere}.workoutPlayerDescription{font-size:clamp(16px,2vw,22px);line-height:1.5;color:#cbd5e1;white-space:pre-wrap;margin:0 0 14px}
.workoutMetrics{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;margin:8px 0}.workoutMetric{background:#0f172a;border:1px solid var(--line);border-radius:16px;padding:12px}.workoutMetric small{display:block;margin-bottom:5px}.workoutMetric b{font-size:clamp(19px,3vw,30px)}
.workoutPlayerTimer{font-variant-numeric:tabular-nums;font-size:clamp(58px,11vw,120px);font-weight:1000;line-height:1;text-align:center;margin:16px 0 6px;text-shadow:0 0 32px #38bdf855}.workoutTimerCaption{text-align:center;color:var(--muted);font-weight:800;min-height:22px}
.workoutPlayerControls{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#020617f2;display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:9px}.workoutPlayerControls button{margin:0;min-height:55px;font-size:15px}.workoutPrimaryAction{background:var(--good);color:#031407}.workoutNextAction{background:var(--accent);color:#00111c}
.workoutPlayerStatus{grid-column:1/-1;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;min-height:16px}.workoutPlayerStatus .okStatus{color:var(--good)}.workoutPlayerStatus .warnStatus{color:var(--warn)}
.workoutResumeCard{border-color:var(--warn);box-shadow:0 0 0 1px #f59e0b44}.workoutResumeCard h3{color:#fbbf24}
@media(max-width:800px){
 .workoutPlayerTop{min-height:62px;padding:9px 10px}.workoutPlayerTop strong{font-size:15px}.workoutPlayerContent{grid-template-columns:1fr;align-content:start;gap:10px;padding:10px}.workoutPlayerMedia{height:min(34vh,310px);min-height:180px;border-radius:16px}.workoutPlayerInfo h1{font-size:clamp(28px,9vw,44px);margin:10px 0 6px}.workoutPlayerDescription{font-size:16px;line-height:1.35;margin-bottom:8px}.workoutMetrics{grid-template-columns:repeat(4,minmax(70px,1fr));gap:6px}.workoutMetric{padding:8px;border-radius:12px}.workoutMetric b{font-size:17px}.workoutMetric small{font-size:10px}.workoutPlayerTimer{font-size:clamp(54px,19vw,92px);margin:8px 0 2px}.workoutPlayerControls{grid-template-columns:repeat(2,1fr);padding:8px 9px calc(9px + env(safe-area-inset-bottom));gap:7px}.workoutPlayerControls button{min-height:48px;padding:9px 8px}.workoutPlayerControls .finishWorkoutButton{grid-column:1/-1}.workoutPlayer.timerless #wpNextButton{grid-column:1/-1}.workoutPlayerStatus{font-size:10px;gap:8px}}
@media(max-width:800px) and (orientation:landscape){.workoutPlayerContent{grid-template-columns:minmax(240px,.9fr) minmax(290px,1.1fr);align-items:center}.workoutPlayerMedia{height:calc(100vh - 190px);min-height:190px}.workoutPlayerInfo h1{font-size:30px}.workoutPlayerDescription{font-size:14px;max-height:62px;overflow:auto}.workoutMetrics{grid-template-columns:repeat(4,1fr)}.workoutPlayerTimer{font-size:58px;margin:4px}.workoutPlayerControls{grid-template-columns:repeat(5,1fr)}.workoutPlayerControls .finishWorkoutButton{grid-column:auto}}


/* ===== Forma PRO v18 — odświeżony interfejs ===== */
:root{--surface-glass:rgba(15,23,42,.78);--shadow:0 18px 50px rgba(0,0,0,.34)}
html{scroll-behavior:smooth;color-scheme:dark}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:
 radial-gradient(circle at 15% -10%,rgba(56,189,248,.24),transparent 32%),
 radial-gradient(circle at 90% 5%,rgba(167,139,250,.16),transparent 28%),#020617;min-height:100vh}
header{padding:14px clamp(14px,3vw,28px);background:rgba(2,6,23,.82);border-bottom:1px solid rgba(148,163,184,.2);box-shadow:0 10px 35px rgba(0,0,0,.25)}
header h1{font-size:clamp(22px,4vw,30px);letter-spacing:-.035em}
header small{font-size:12px;letter-spacing:.035em}
main{max-width:1240px;padding:10px clamp(10px,2.5vw,24px) 90px}
.tabs{position:sticky;top:74px;z-index:8;padding:10px 2px;margin:0 -2px;background:linear-gradient(180deg,rgba(2,6,23,.96),rgba(2,6,23,.76),transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:rgba(15,23,42,.86);border-color:rgba(148,163,184,.22);box-shadow:0 6px 18px rgba(0,0,0,.16);transition:transform .16s ease,border-color .16s ease,background .16s ease}
.tab:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.55)}
.tab.active{background:linear-gradient(135deg,#38bdf8,#60a5fa);box-shadow:0 8px 24px rgba(56,189,248,.25)}
.card,.todayHero,.dayFullCard{background:linear-gradient(155deg,rgba(17,24,39,.96),rgba(8,15,30,.93));border-color:rgba(148,163,184,.2);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.card{border-radius:22px;padding:clamp(14px,2.2vw,20px)}
.stat,.daySummaryBox,.workoutMetric{background:linear-gradient(145deg,rgba(30,41,59,.9),rgba(15,23,42,.9));border-color:rgba(148,163,184,.18)}
button{min-height:44px;transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.985)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:none}
input,textarea,select{background:rgba(2,6,23,.78);border-color:rgba(148,163,184,.28);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.workoutPlayerControls{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.workoutPlayerControls button{min-width:0!important;margin:0!important;white-space:normal;line-height:1.15}
.workoutPlayerControls .finishWorkoutButton{grid-column:auto!important}
.workoutPlayer.timerless #wpNextButton{grid-column:auto!important}
.workoutPreviewNote{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.26);color:#fde68a;font-weight:800}
@media(max-width:650px){
 header{padding:11px 12px}.tabs{top:65px}.card{border-radius:17px}.workoutPlayerControls{gap:4px!important;padding:7px 5px calc(7px + env(safe-area-inset-bottom))!important}.workoutPlayerControls button{font-size:clamp(9px,2.55vw,12px)!important;padding:7px 3px!important;min-height:52px!important;border-radius:9px!important}.workoutPlayerStatus{font-size:9px!important}}
</style>
</head>
<body class="auth-locked">

<div id="appAuthGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="authCard">
    <div class="authLogo">🔒</div>
    <h1 id="authTitle">Forma PRO</h1>
    <p id="authDescription" class="muted">Wprowadź hasło, aby uruchomić aplikację.</p>
    <form id="appAuthForm" onsubmit="authenticateFormaPro(event)">
      <label for="appAuthPassword">Hasło</label>
      <input id="appAuthPassword" type="password" autocomplete="current-password" inputmode="text" placeholder="Wpisz hasło" aria-describedby="authMessage">
      <div id="appAuthConfirmWrap" class="hidden">
        <label for="appAuthPasswordConfirm">Powtórz hasło</label>
        <input id="appAuthPasswordConfirm" type="password" autocomplete="new-password" inputmode="text" placeholder="Powtórz hasło" aria-describedby="authMessage">

<script>
const KEYS={
 data:"forma_pro_days_v4",settings:"forma_pro_settings_v4",body:"forma_pro_body_v4",meals:"forma_pro_meals_v4",
 photos:"forma_pro_photos_v4",protein:"forma_pro_protein_v4",products:"forma_pro_products_v4",
 calendar:"forma_pro_calendar_v4",workouts:"forma_pro_workouts_v4",privatePass:"forma_pro_private_pass_v4",
 privateData:"forma_pro_private_data_v4",privatePhotos:"forma_pro_private_photos_v4",workoutLog:"forma_pro_workout_log_v4",
 calendarPlanVersion:"forma_pro_calendar_plan_v2",calendarPlanCarry:"forma_pro_calendar_plan_carry_v1",backExerciseUpgrade:"forma_pro_back_exercises_v1",benchBandUpgrade:"forma_pro_bench_band_pack_v1"
};

const MEDIA_DB="forma_pro_media_db_v1";
const MEDIA_STORE="media";
const MEDIA_CACHE={};
let mediaDbPromise=null;
function openMediaDb(){
 if(mediaDbPromise) return mediaDbPromise;
 mediaDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(MEDIA_DB,1);
  req.onupgradeneeded=()=>req.result.createObjectStore(MEDIA_STORE);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
 return mediaDbPromise;
}
async function putMedia(key,value){
 const db=await openMediaDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readwrite");
  tx.objectStore(MEDIA_STORE).put(value,key);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
}
async function getMedia(key){
 if(!key) return "";
 if(MEDIA_CACHE[key]) return MEDIA_CACHE[key];
 const db=await openMediaDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readonly");
  const req=tx.objectStore(MEDIA_STORE).get(key);
  req.onsuccess=()=>{MEDIA_CACHE[key]=req.result||""; resolve(MEDIA_CACHE[key]);};
  req.onerror=()=>reject(req.error);
 });
}
async function deleteMedia(key){
 if(!key) return;
 delete MEDIA_CACHE[key];
 const db=await openMediaDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readwrite");
  tx.objectStore(MEDIA_STORE).delete(key);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
}
function mediaKey(type,id,field){return `${type}_${id}_${field}`}
async function mediaSrc(key,fallback=""){
 return key ? await getMedia(key) : (fallback||"");
}
async function resizeImageToDataURL(file,maxW=1280,maxH=1280,quality=0.82){
 return new Promise((resolve,reject)=>{
  if(!file) return resolve("");
  const reader=new FileReader();
  reader.onerror=()=>reject(reader.error);
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    let w=img.width,h=img.height;
    const scale=Math.min(1,maxW/w,maxH/h);
    w=Math.round(w*scale); h=Math.round(h*scale);
    const canvas=document.createElement("canvas");
    canvas.width=w; canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL("image/jpeg",quality));
   };
   img.onerror=()=>resolve(reader.result);
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
async function fileToDataURL(file){
 return resizeImageToDataURL(file,1280,1280,0.82);
}
const defaultSettings={weeklyGoal:4,treadmillMin:40,gymMin:30,proteinGoal:160,levelSize:500};
const bodyFields=[["weight","Waga kg"],["waist","Pas cm"],["belly","Brzuch cm"],["chest","Klatka cm"],["hips","Biodra cm"],["thigh","Udo cm"],["arm","Ramię cm"]];
const privateFields=[["length","Długość / cm"],["girth","Obwód / cm"],["note","Notatka"]];

let selectedBodyDate=iso();
let selectedWorkoutDate=iso();

function jget(k,def){
 try{
  const raw=localStorage.getItem(k);
  if(raw===null||raw===undefined||raw==='') return def;
  return JSON.parse(raw);
 }catch(e){
  console.warn('Uszkodzone dane localStorage:',k,e);
  return def;
 }
}
function jset(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(prefix='id'){return prefix+'_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function settings(){return {...defaultSettings,...jget(KEYS.settings,{})}}
function data(){return jget(KEYS.data,{})}
function bodyData(){return jget(KEYS.body,[])}
function meals(){return jget(KEYS.meals,[])}
function photos(){return normalizeByDate(jget(KEYS.photos,[]),KEYS.photos)}

function workoutLog(){return jget(KEYS.workoutLog,[])}
function saveWorkoutLog(list){jset(KEYS.workoutLog,list)}
function trainingDayNumber(){return workoutLog().length+1}
function progressValue(base, type){
 const day=Math.max(1,trainingDayNumber());
 const val=Number(base||0);
 if(!val) return "";
 if(type==="seconds") return val + Math.floor((day-1)/3)*5;
 return val + Math.floor((day-1)/2);
}
function privData(){return jget(KEYS.privateData,[])}
function privPhotos(){return normalizeByDate(jget(KEYS.privatePhotos,[]),KEYS.privatePhotos)}
function normalizeByDate(list,key){
 if(!Array.isArray(list)) return [];
 const map=new Map();
 list.forEach(x=>{ if(x && x.date) map.set(x.date,x); });
 const clean=[...map.values()];
 if(clean.length!==list.length) localStorage.setItem(key,JSON.stringify(clean));
 return clean;
}
function iso(d=new Date()){
 const x=new Date(d);
 const y=x.getFullYear();
 const m=String(x.getMonth()+1).padStart(2,"0");
 const day=String(x.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function msToNextMidnight(){
 const now=new Date();
 const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2);
 return next-now;
}
function scheduleMidnightRefresh(){
 setTimeout(()=>{render(); scheduleMidnightRefresh();}, msToNextMidnight());
}
function localDate(date){
 if(typeof date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(date)){
  const [y,m,d]=date.split('-').map(Number);
  return new Date(y,m-1,d,12,0,0,0);
 }
 const x=date instanceof Date ? new Date(date) : new Date();
 return new Date(x.getFullYear(),x.getMonth(),x.getDate(),12,0,0,0);
}
function mondayOf(d=new Date()){let x=localDate(d);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function weekDates(){let m=mondayOf();return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return iso(d)})}
function monthDates(year=null,month=null){
 let base=calendarViewDate||localDate();
 let y=Number.isInteger(year)?year:base.getFullYear();
 let m=Number.isInteger(month)?month:base.getMonth();
 let first=new Date(y,m,1,12);
 let start=new Date(first);
 let shift=(first.getDay()+6)%7; // Monday = 0
 start.setDate(first.getDate()-shift);
 let last=new Date(y,m+1,0,12);
 let end=new Date(last);
 let endShift=6-((last.getDay()+6)%7);
 end.setDate(last.getDate()+endShift);
 let arr=[];
 for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
   arr.push(iso(new Date(d)));
 }
 return arr;
}
function isCurrentMonth(date,year=null,month=null){
 let d=localDate(date), base=calendarViewDate||localDate();
 let y=Number.isInteger(year)?year:base.getFullYear();
 let m=Number.isInteger(month)?month:base.getMonth();
 return d.getMonth()===m && d.getFullYear()===y;
}
function isToday(date){return date===iso()}
function monthLabel(year=null,month=null){
 let base=calendarViewDate||localDate();
 let y=Number.isInteger(year)?year:base.getFullYear();
 let m=Number.isInteger(month)?month:base.getMonth();
 return new Date(y,m,1,12).toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
}

function calendarNextMonth(){calendarViewDate=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth()+1,1,12);renderCalendar()}

function openWorkoutForDate(date){selectedWorkoutDate=date||iso();show('workouts')}
const PLAN_FIELDS={training:"planTraining",measure:"planMeasure",photo:"planPhoto",injection:"planInjection"};
function addDaysIso(date,days){const d=localDate(date);d.setDate(d.getDate()+Number(days||0));return iso(d)}
function hasBodyMeasurement(date){return bodyData().some(x=>x.date===date&&bodyFields.some(([k])=>String(x[k]??"").trim()!==""))}
function hasPhotoSet(date){return photos().some(x=>x.date===date)}
function sameCalendarWeek(a,b){return iso(mondayOf(a))===iso(mondayOf(b))}
function actualForPlanType(type,date){
 if(type==="measure") return hasBodyMeasurement(date);
 if(type==="photo") return hasPhotoSet(date);
 if(type==="training") return completedTrainingsForDate(date)>0;
 if(type==="injection") return !!(calData()[date]||{}).injection;
 return false;
}
function pruneEmptyCalendar(c){Object.keys(c).forEach(date=>{if(!c[date]||!Object.values(c[date]).some(Boolean))delete c[date]});return c}
function planCarry(){return jget(KEYS.calendarPlanCarry,{})}
function setPlanCarry(type,weekStart=""){let x=planCarry();if(weekStart)x[type]=weekStart;else delete x[type];jset(KEYS.calendarPlanCarry,x)}
function setPlanForDate(type,date,enabled=true){
 const field=PLAN_FIELDS[type]; if(!field||!date)return;
 let c=calData();
 if(enabled){
  Object.keys(c).forEach(d=>{if(c[d]?.[field])delete c[d][field]});
  c[date]=c[date]||{};c[date][field]=true;setPlanCarry(type,"");
 }else if(c[date]) delete c[date][field];
 jset(KEYS.calendar,pruneEmptyCalendar(c));
}
function clearPlansFrom(type,fromDate="0000-00-00"){
 const field=PLAN_FIELDS[type];if(!field)return;
 let c=calData();Object.keys(c).forEach(date=>{if(date>=fromDate&&c[date]?.[field])delete c[date][field]});
 jset(KEYS.calendar,pruneEmptyCalendar(c));setPlanCarry(type,"");
}
function completeRecurringTask(type,date,alwaysSchedule=false){
 const field=PLAN_FIELDS[type]; if(!field||!date)return;
 let c=calData();const carry=planCarry();
 const hadPlanThisWeek=Object.entries(c).some(([d,v])=>!!v?.[field]&&sameCalendarWeek(d,date))||carry[type]===iso(mondayOf(date));
 Object.keys(c).forEach(d=>{if(c[d]?.[field])delete c[d][field]});
 c[date]=c[date]||{};
 if(type==="training")c[date].training=true;
 if(type==="measure")c[date].measure=true;
 if(type==="photo")c[date].photo=true;
 if(type==="injection")c[date].injection=true;
 if(alwaysSchedule||hadPlanThisWeek){const next=addDaysIso(date,7);c[next]=c[next]||{};c[next][field]=true}
 jset(KEYS.calendar,pruneEmptyCalendar(c));setPlanCarry(type,"");
}
function addWeeklyReminder(type,fromDate){setPlanForDate(type,addDaysIso(fromDate,7),true)}
function cleanupExpiredPlans(){
 let c=calData(),today=iso(),changed=false;
 Object.entries(PLAN_FIELDS).forEach(([type,field])=>{
  Object.keys(c).forEach(date=>{
   if(date<today&&c[date]?.[field]&&!actualForPlanType(type,date)){
    delete c[date][field];changed=true;
   }
  });
  const future=Object.keys(c).filter(date=>date>=today&&c[date]?.[field]).sort();
  future.slice(1).forEach(date=>{delete c[date][field];changed=true});
 });
 if(changed)jset(KEYS.calendar,pruneEmptyCalendar(c));
 const carry=planCarry();
 if(Object.keys(carry).length)jset(KEYS.calendarPlanCarry,{});
}
function migrateLegacyCalendarPlans(){
 if(localStorage.getItem(KEYS.calendarPlanVersion)==="2"){cleanupExpiredPlans();return}
 let c=calData(),today=iso();
 ["measure","photo"].forEach(type=>{
  const candidates=[];
  Object.keys(c).sort().forEach(date=>{
   if(!c[date]?.[type])return;
   if(actualForPlanType(type,date))return;
   delete c[date][type];
   if(date>=today)candidates.push(date);
  });
  if(candidates.length){const field=PLAN_FIELDS[type],date=candidates[0];c[date]=c[date]||{};c[date][field]=true}
 });
 const injectionPlans=[];
 Object.keys(c).sort().forEach(date=>{
  if(date>=today&&c[date]?.injection){delete c[date].injection;injectionPlans.push(date)}
 });
 if(injectionPlans.length){const date=injectionPlans[0];c[date]=c[date]||{};c[date].planInjection=true}
 jset(KEYS.calendar,pruneEmptyCalendar(c));
 localStorage.setItem(KEYS.calendarPlanVersion,"2");
 cleanupExpiredPlans();
}
function weekNo(date=new Date()){
 const d=localDate(date);
 d.setDate(d.getDate()+3-((d.getDay()+6)%7));
 const week1=new Date(d.getFullYear(),0,4,12);
 return 1+Math.round(((d-week1)/86400000-3+((week1.getDay()+6)%7))/7);
}

function proteinToday(date=iso()){return proteinData()[date]||[]}
function proteinSum(date=iso()){return proteinToday(date).reduce((a,x)=>a+Number(x.grams||0),0)}

function markCalendar(date,field,value=true){let c=calData();c[date]=c[date]||{};c[date][field]=value;jset(KEYS.calendar,c)}
function completedTrainings(e){let s=settings(),c=0;if(Number(e.treadmillMin||0)>=s.treadmillMin)c++;if(Number(e.gymMin||0)>=s.gymMin)c++;return c}
function workoutLogCount(date){return workoutLog().filter(x=>x.date===date).length}
function completedTrainingsForDate(date){

 const logCount=workoutLogCount(date);
 const manual=(calData()[date]||{}).training?1:0;
 return Math.max(entryCount,logCount,manual);
}
function xpFromDate(date){

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

function allStats(){

}

function renderDashboard(){
 const s=settings(),w=weekProgress(),st=allStats();
 const pct=Math.min(100,Math.round(w.total/s.weeklyGoal*100)),left=Math.max(0,s.weeklyGoal-w.total);
 const level=Math.floor(st.xp/s.levelSize)+1,inLevel=st.xp%s.levelSize;
 document.getElementById("dashboard").innerHTML=`
 <div class="card"><h2>Kokpit</h2><div class="progress bigProgress"><div class="bar" style="width:${pct}%"></div></div>
  <h3>Tydzień ${weekNo()}: ${w.total}/${s.weeklyGoal} treningów</h3>

  <span class="badge">Bieżnia od ${s.treadmillMin} min</span><span class="badge">Siłownia od ${s.gymMin} min</span></div>
 <div class="grid">
  <div class="stat"><small>Waga od startu</small><br><b>${bodyDiff("weight","kg")}</b></div>

let photoSaving=false;
async function savePhotos(){
 if(photoSaving) return;
 photoSaving=true;
 try{
  const id=String(Date.now());
  const date=photoDate.value||iso();
  const front=await fileToDataURL(frontPhoto.files[0]);
  const side=await fileToDataURL(sidePhoto.files[0]);
  if(!front&&!side){alert("Dodaj przynajmniej jedno zdjęcie.");return}
  const oldSameDate=photos().filter(x=>x.date===date);
  for(const old of oldSameDate){await deleteMedia(old.frontKey); await deleteMedia(old.sideKey)}
  const entry={id,date,frontKey:"",sideKey:""};
  if(front){entry.frontKey=mediaKey("photo",id,"front"); await putMedia(entry.frontKey,front)}
  if(side){entry.sideKey=mediaKey("photo",id,"side"); await putMedia(entry.sideKey,side)}
  const list=photos().filter(x=>x.date!==date);
  list.push(entry);
  jset(KEYS.photos,list);
  completeRecurringTask("photo",date,true);
  frontPhoto.value=""; sidePhoto.value="";
  render();alert("Zdjęcia zapisane. Jeśli w tej dacie były wcześniejsze zdjęcia, zostały zastąpione nowym zestawem.");
 }catch(e){console.error(e);alert("Nie udało się zapisać zdjęcia. Sprawdź pamięć przeglądarki albo spróbuj mniejsze zdjęcie.")}
 finally{photoSaving=false;}
}

function saveDayFlags(date){
 selectedBodyDate=date;selectedWorkoutDate=date;
 const before=calData()[date]||{};
 let c=calData();c[date]={...before,duty:!!edDuty.checked,training:!!edTraining.checked,injection:!!edInjection.checked};
 jset(KEYS.calendar,pruneEmptyCalendar(c));
 setPlanForDate("training",date,!!edPlanTraining.checked);
 setPlanForDate("measure",date,!!edPlanMeasure.checked);
 setPlanForDate("photo",date,!!edPlanPhoto.checked);
 setPlanForDate("injection",date,!!edPlanInjection.checked);
 if(edTraining.checked&&!before.training)completeRecurringTask("training",date,false);
 if(edInjection.checked&&!before.injection)completeRecurringTask("injection",date,true);
 if(!edTraining.checked&&before.training){let x=calData();if(x[date])delete x[date].training;jset(KEYS.calendar,pruneEmptyCalendar(x))}
 if(!edInjection.checked&&before.injection){let x=calData();if(x[date])delete x[date].injection;jset(KEYS.calendar,pruneEmptyCalendar(x))}

function circuitSteps(){
 const cur=todayWorkout(), exs=cur?.ex||[];
 let steps=[];
 const maxSets=Math.max(1,...exs.map(e=>Number(e.sets||1)));
 for(let s=1;s<=maxSets;s++){
   exs.forEach((e,i)=>{if(Number(e.sets||1)>=s)steps.push({set:s,idx:i,e})});
 }
 return steps;
}
function currentStepIndex(){
 return circuitSteps().findIndex(x=>x.idx===currentExerciseIndex && x.set===currentSet);
}
function goToStep(pos){
 const steps=circuitSteps();
 if(!steps.length) return;
 if(pos>=steps.length){alert("Trening zakończony.");finishWorkout();currentExerciseIndex=0;currentSet=1;timerLeft=0;renderWorkouts();return}
 mode="work";
 currentExerciseIndex=steps[pos].idx;
 currentSet=steps[pos].set;
 timerLeft=Number(progressValue(steps[pos].e.seconds,"seconds")||0);
 renderWorkouts();
 if(timerLeft) startTimer();
}
function startWorkout(){
 clearInterval(timerId);
 mode="work";
 currentExerciseIndex=0;currentSet=1;
 const e=todayWorkout()?.ex?.[0];
 timerLeft=Number(progressValue(e?.seconds,"seconds")||0);
 renderWorkouts();
 if(timerLeft) startTimer();
}
function startTimer(){
 clearInterval(timerId);
 timerId=setInterval(()=>{
  if(timerLeft>0){
   timerLeft--;
   let box=document.getElementById("timerBox");
   if(box)box.textContent=timerLeft+"s";
  }else{
   clearInterval(timerId);
   if(mode==="rest") nextCircuitStep();
  }
 },1000)
}
function startRest(){
 clearInterval(timerId);
 let e=todayWorkout()?.ex?.[currentExerciseIndex];
 mode="rest";
 timerLeft=Number(e?.rest||0);
 renderWorkouts();
 if(timerLeft) startTimer(); else nextCircuitStep();
}
function completeSetCircuit(){
 startRest();
}
function nextCircuitStep(){
 clearInterval(timerId);
 mode="work";
 let pos=currentStepIndex();
 goToStep(pos+1);
}
function finishWorkout(){
 clearInterval(timerId);
 mode="work";
 const date=(document.getElementById("workoutDate")?.value)||selectedWorkoutDate||iso();
 selectedWorkoutDate=date;
 const entry={id:uid('wlog'),date,workout:todayWorkout()?.name||"Trening",dayNumber:trainingDayNumber()};
 let log=workoutLog();
 if(!log.some(x=>sameWorkoutLog(x,entry))){
  log.push(entry);
  saveWorkoutLog(log);
 }

 markCalendar(date,"training",true);

 const w=workouts();
 currentWorkoutIndex=(currentWorkoutIndex+1)%Math.max(1,w.length);
 currentExerciseIndex=0;
 currentSet=1;
 timerLeft=0;

 alert("Trening zapisany dla wybranej daty. Kalendarz oznaczony na zielono.");
 render();
}

 ctx.strokeStyle="#38bdf8";ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>{let x=pad+(w-2*pad)*(i/Math.max(1,points.length-1));let y=(h-pad)-((p.y-min)/range)*(h-2*pad);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();

function sameProduct(a,b){return normTxt(a.name)===normTxt(b.name)&&Number(a.protein||0)===Number(b.protein||0)}
function sameWorkoutLog(a,b){return backupDayKey(a)===backupDayKey(b)&&normTxt(a.workout)===normTxt(b.workout)}
function sameExercise(a,b){return normTxt(a.name)===normTxt(b.name)&&normTxt(a.desc)===normTxt(b.desc)&&String(a.sets||"")===String(b.sets||"")&&String(a.reps||"")===String(b.reps||"")&&String(a.seconds||"")===String(b.seconds||"")}
function mergeObjFillMissing(existing,incoming){

 return out;
}
function mergeArrayUnique(current,incoming,sameFn){

 (Array.isArray(incoming)?incoming:[]).forEach(item=>{
  if(out.some(x=>sameFn(x,item))){skipped++;return}
  out.push({...item,id:item.id||String(Date.now()+Math.random())});added++;
 });
 return{list:out,added,skipped};
}
function mergeByDateArray(current,incoming){
 const out=[...(Array.isArray(current)?current:[])];let added=0,updated=0,skipped=0;
 (Array.isArray(incoming)?incoming:[]).forEach(item=>{
  const d=backupDayKey(item);
  const idx=out.findIndex(x=>backupDayKey(x)===d);
  if(idx>=0){
   const before=JSON.stringify(out[idx]);
   out[idx]=mergeObjFillMissing(out[idx],item);
   if(JSON.stringify(out[idx])===before) skipped++; else updated++;
  }else{out.push({...item,id:item.id||String(Date.now()+Math.random())});added++;}
 });
 return{list:out,added,updated,skipped};
}
function mergeDataByDate(current,incoming){
 const out={...(current||{})};let added=0,updated=0,skipped=0;
 Object.entries(incoming||{}).forEach(([date,val])=>{
  if(!out[date]){out[date]=val;added++;return}
  const before=JSON.stringify(out[date]);
  out[date]=mergeObjFillMissing(out[date],val);
  if(JSON.stringify(out[date])===before) skipped++; else updated++;
 });
 return{obj:out,added,updated,skipped};
}
function mergeProteinByDate(current,incoming){
 const out={...(current||{})};let added=0,skipped=0;
 Object.entries(incoming||{}).forEach(([date,arr])=>{
  out[date]=Array.isArray(out[date])?[...out[date]]:[];
  (Array.isArray(arr)?arr:[]).forEach(item=>{
   if(out[date].some(x=>sameProtein(x,item))){skipped++;return}
   out[date].push({...item,id:item.id||String(Date.now()+Math.random())});added++;
  });
 });
 return{obj:out,added,skipped};
}
function mergeCalendar(current,incoming){
 const out={...(current||{})};let added=0,updated=0,skipped=0;
 Object.entries(incoming||{}).forEach(([date,val])=>{
  const before=JSON.stringify(out[date]||{});
  out[date]={...(out[date]||{})};
  Object.entries(val||{}).forEach(([k,v])=>{out[date][k]=Boolean(out[date][k]||v)});
  if(before==="{}") added++; else if(JSON.stringify(out[date])===before) skipped++; else updated++;
 });
 return{obj:out,added,updated,skipped};
}
function mergeWorkouts(current,incoming){
 const out=Array.isArray(current)?JSON.parse(JSON.stringify(current)):[];let added=0,skipped=0;
 (Array.isArray(incoming)?incoming:[]).forEach(day=>{
  let target=out.find(x=>normTxt(x.name)===normTxt(day.name));
  if(!target){out.push(day);added+=(day.ex||[]).length||1;return}
  target.ex=Array.isArray(target.ex)?target.ex:[];
  (day.ex||[]).forEach(exr=>{
   if(target.ex.some(x=>sameExercise(x,exr))){skipped++;return}
   target.ex.push({...exr,id:exr.id||String(Date.now()+Math.random())});added++;
  });
 });
 return{list:out,added,skipped};
}
function collectMediaKeysFromBackup(pack){
 const keys=new Set();
 (pack.photos||[]).forEach(p=>{
  if(p.frontKey) keys.add(p.frontKey);
  if(p.sideKey) keys.add(p.sideKey);
 });
 (pack.privatePhotos||[]).forEach(p=>{
  if(p.imgKey) keys.add(p.imgKey);
 });
 (pack.workouts||[]).forEach(day=>{
  (day.ex||[]).forEach(exr=>{
   if(exr.imgKey) keys.add(exr.imgKey);
  });
 });
 return [...keys];
}
async function getAllStoredMedia(){
 const out={};
 try{
  const db=await openMediaDb();
  const keys=await new Promise((resolve,reject)=>{
   const tx=db.transaction(MEDIA_STORE,"readonly");
   const store=tx.objectStore(MEDIA_STORE);
   const req=store.getAllKeys ? store.getAllKeys() : null;
   if(!req){resolve([]);return}
   req.onsuccess=()=>resolve(req.result||[]);
   req.onerror=()=>reject(req.error);
  });
  for(const key of keys){
   const value=await getMedia(key);
   if(value) out[key]=value;
  }
 }catch(e){
  console.warn('Nie udało się pobrać pełnej listy zdjęć z IndexedDB:',e);
 }
 return out;
}

   if(x.workouts){let m=mergeWorkouts(workouts(),x.workouts);jset(KEYS.workouts,m.list);report.push(`ćwiczenia +${m.added}, pominięte ${m.skipped}`)}
   if(x.privateData){let m=mergeByDateArray(privData(),x.privateData);jset(KEYS.privateData,m.list);report.push(`prywatne pomiary +${m.added}, uzupełnione ${m.updated}, pominięte ${m.skipped}`)}
   if(x.privatePhotos){let m=mergeByDateArray(privPhotos(),x.privatePhotos);jset(KEYS.privatePhotos,m.list);report.push(`prywatne zdjęcia +${m.added}, uzupełnione ${m.updated}, pominięte ${m.skipped}`)}
   if(x.workoutLog){let m=mergeArrayUnique(workoutLog(),x.workoutLog,sameWorkoutLog);jset(KEYS.workoutLog,m.list);report.push(`historia treningów +${m.added}, pominięte ${m.skipped}`)}
   if(x.media){
    let mediaAdded=0,mediaSkipped=0;
    for(const [key,value] of Object.entries(x.media)){

    }

   }
   

normalizeAllLocalData();
   input.value='';

  }catch(e){console.error(e);alert("Błędny plik kopii albo niepełny import."); input.value=''}
 };
 r.readAsText(f);
}

function directSet(k,v){localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v))}
function jset(k,v){
 localStorage.setItem(k,JSON.stringify(v));
 if(!AUTO_BACKUP_SUSPENDED && k!==KEYS.autoBackupSignature && k!==KEYS.autoBackupAt && k!==KEYS.autoBackupError){
  scheduleAutoBackup("zmiana danych");
 }
}
async function putMedia(key,value){
 const db=await openMediaDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readwrite");
  tx.objectStore(MEDIA_STORE).put(value,key);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
 MEDIA_CACHE[key]=value;
 if(!AUTO_BACKUP_SUSPENDED) scheduleAutoBackup("zmiana zdjęć");
 return true;
}
async function deleteMedia(key){
 if(!key)return;
 delete MEDIA_CACHE[key];
 const db=await openMediaDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readwrite");
  tx.objectStore(MEDIA_STORE).delete(key);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
 if(!AUTO_BACKUP_SUSPENDED) scheduleAutoBackup("usunięcie zdjęcia");
}
async function clearMediaStore(){
 const db=await openMediaDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,"readwrite");
  tx.objectStore(MEDIA_STORE).clear();
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
 Object.keys(MEDIA_CACHE).forEach(k=>delete MEDIA_CACHE[k]);
}

function openBackupDb(){
 if(backupDbPromise)return backupDbPromise;
 backupDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(AUTO_BACKUP_DB,1);
  req.onupgradeneeded=()=>{
   const db=req.result;
   if(!db.objectStoreNames.contains(AUTO_BACKUP_STORE))db.createObjectStore(AUTO_BACKUP_STORE,{keyPath:"id"});
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
 return backupDbPromise;
}
async function saveBackupSnapshot(snapshot){
 const db=await openBackupDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(AUTO_BACKUP_STORE,"readwrite");
  tx.objectStore(AUTO_BACKUP_STORE).put(snapshot);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
 await pruneBackupSnapshots();
}
async function listBackupSnapshots(){
 const db=await openBackupDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUTO_BACKUP_STORE,"readonly");
  const req=tx.objectStore(AUTO_BACKUP_STORE).getAll();
  req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))));
  req.onerror=()=>reject(req.error);
 });
}
async function getBackupSnapshot(id){
 const db=await openBackupDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUTO_BACKUP_STORE,"readonly");
  const req=tx.objectStore(AUTO_BACKUP_STORE).get(id);
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>reject(req.error);
 });
}
async function deleteBackupSnapshot(id){
 const db=await openBackupDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(AUTO_BACKUP_STORE,"readwrite");
  tx.objectStore(AUTO_BACKUP_STORE).delete(id);
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
 renderSettings();
}
async function pruneBackupSnapshots(){
 const list=await listBackupSnapshots();
 const excess=list.slice(AUTO_BACKUP_LIMIT);
 if(!excess.length)return;
 const db=await openBackupDb();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(AUTO_BACKUP_STORE,"readwrite");
  const store=tx.objectStore(AUTO_BACKUP_STORE);
  excess.forEach(x=>store.delete(x.id));
  tx.oncomplete=()=>resolve(true);
  tx.onerror=()=>reject(tx.error);
 });
}
function simpleHash(text){
 let h=2166136261;
 for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
 return (h>>>0).toString(16);
}

function scheduleAutoBackup(reason="zmiana danych"){
 if(AUTO_BACKUP_SUSPENDED||settings().autoBackup===false)return;
 clearTimeout(autoBackupTimer);
 autoBackupTimer=setTimeout(()=>createAutoBackup(reason),2500);
}
async function createAutoBackup(reason="automatyczna",force=false){
 if(AUTO_BACKUP_SUSPENDED||(!force&&settings().autoBackup===false))return false;
 try{
  const signature=coreBackupSignature();
  if(!force&&signature===localStorage.getItem(KEYS.autoBackupSignature))return false;
  const pack=await buildFullBackupPackage();
  const snapshot={id:uid("backup"),createdAt:new Date().toISOString(),reason,signature,pack};
  await saveBackupSnapshot(snapshot);
  directSet(KEYS.autoBackupSignature,signature);
  directSet(KEYS.autoBackupAt,snapshot.createdAt);
  localStorage.removeItem(KEYS.autoBackupError);
  return true;
 }catch(e){
  console.error("Błąd automatycznej kopii:",e);
  directSet(KEYS.autoBackupError,String(e?.message||e));
  return false;
 }
}
async function restoreAutoBackup(id){
 const snapshot=await getBackupSnapshot(id);
 if(!snapshot?.pack){alert("Nie znaleziono tej kopii.");return}
 if(!confirm(`Przywrócić kopię z ${new Date(snapshot.createdAt).toLocaleString("pl-PL")}? Aktualne dane zostaną wcześniej zabezpieczone.`))return;
 await createAutoBackup("przed przywróceniem kopii",true);
 await applyBackupPackage(snapshot.pack,"replace");
 alert("Kopia została przywrócona.");
 render();
}

function normalizeExerciseName(name){return String(name||"").trim().toLowerCase().replace(/\s+/g," ")}
function cloneExercise(exr){
 return {
  ...JSON.parse(JSON.stringify(exr||{})),
  id:uid("ex"),
  libraryId:exr?.libraryId||exr?.id||"",
  sets:String(exr?.sets||3),reps:String(exr?.reps||""),seconds:String(exr?.seconds||""),rest:String(exr?.rest||60)
 };
}
function exerciseLibrary(){return jget(KEYS.exerciseLibrary,[])}
function saveExerciseLibrary(list){jset(KEYS.exerciseLibrary,list)}
function findLibraryExerciseFor(exr,lib=exerciseLibrary()){
 return lib.find(x=>normalizeExerciseName(x.name)===normalizeExerciseName(exr?.name))||(!String(exr?.name||'').trim()?lib.find(x=>String(x.id)===String(exr?.libraryId)):null);
}
function exerciseImageOwner(exr,lib=exerciseLibrary()){
 const libraryExercise=findLibraryExerciseFor(exr,lib);
 if(libraryExercise&&(libraryExercise.imgKey||libraryExercise.img))return libraryExercise;
 return exr||{};
}
function exerciseImageReference(exr,lib=exerciseLibrary()){
 const owner=exerciseImageOwner(exr,lib),fallback=owner===exr?{}:(exr||{});
 const key=owner?.imgKey||'',legacy=owner?.img||'',fallbackKey=fallback?.imgKey||'',fallbackLegacy=fallback?.img||'';
 return {key,legacy,fallbackKey,fallbackLegacy,token:[key,legacy,fallbackKey,fallbackLegacy].filter(Boolean).join('|')};
}
async function exerciseImageSrc(exr,lib=exerciseLibrary()){
 const ref=exerciseImageReference(exr,lib);
 const primary=await mediaSrc(ref.key,ref.legacy);
 if(primary)return primary;
 return mediaSrc(ref.fallbackKey,ref.fallbackLegacy);
}
function syncExerciseLibraryFromWorkouts(){
 const lib=exerciseLibrary(),w=workouts();let changed=false;
 w.forEach(day=>(day.ex||[]).forEach(exr=>{
  let found=findLibraryExerciseFor(exr,lib);
  if(!found){
   found={...JSON.parse(JSON.stringify(exr)),id:uid("lib")};delete found.libraryId;lib.push(found);changed=true;
  }
  if(exr.libraryId!==found.id){exr.libraryId=found.id;changed=true}
  if((found.imgKey||found.img)&&(exr.imgKey||exr.img)){
   delete exr.imgKey;delete exr.img;changed=true;
  }
 }));
 if(changed){saveExerciseLibrary(lib);jset(KEYS.workouts,w)}
 return lib;
}

async function runAppMigrations(){

function exerciseKey(exr){return String(exr?.id||exr?.libraryId||normalizeExerciseName(exr?.name))}
function resultMatchesExercise(result,exr){
 return String(result?.exerciseId||"")===String(exr?.id||"")||
        String(result?.libraryId||"")===String(exr?.libraryId||"")||
        normalizeExerciseName(result?.exerciseName)===normalizeExerciseName(exr?.name);
}
function lastExercisePerformance(exr){
 const logs=workoutLog().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
 for(const log of logs){
  const sets=(log.setResults||[]).filter(r=>resultMatchesExercise(r,exr));
  if(sets.length)return {log,sets,last:sets[sets.length-1]};
 }
 return null;
}
function exerciseSuggestion(exr){
 const perf=lastExercisePerformance(exr);
 const baseReps=Number(exr?.reps||0),baseSeconds=Number(exr?.seconds||0);
 if(!perf)return {reps:baseReps||"",seconds:baseSeconds||"",load:"",source:"bazowo"};
 const completed=!perf.log.partial&&perf.sets.every(x=>x.completed!==false);
 const reps=Number(perf.last.reps||0);const seconds=Number(perf.last.seconds||0);
 return {
  reps:reps?(reps+(completed?1:0)):(baseReps||""),
  seconds:seconds?(seconds+(completed?5:0)):(baseSeconds||""),
  load:perf.last.load||"",
  source:perf.log.date
 };
}
function currentSessionResult(exr,setNo){return activeWorkoutSession.results[`${exerciseKey(exr)}|${setNo}`]||null}
function recordCurrentSet(completed=true){
 const exr=todayWorkout()?.ex?.[currentExerciseIndex];if(!exr)return;
 const suggestion=exerciseSuggestion(exr);
 const result={
  exerciseId:exr.id||"",libraryId:exr.libraryId||"",exerciseName:exr.name||"Ćwiczenie",set:Number(currentSet||1),
  reps:Number(document.getElementById("activeReps")?.value||suggestion.reps||0)||"",
  seconds:Number(document.getElementById("activeSeconds")?.value||suggestion.seconds||0)||"",
  load:String(document.getElementById("activeLoad")?.value||suggestion.load||"").trim(),completed:!!completed
 };
 activeWorkoutSession.results[`${exerciseKey(exr)}|${currentSet}`]=result;
}
function progressSummary(exr){
 const perf=lastExercisePerformance(exr),s=exerciseSuggestion(exr);
 if(!perf)return `Brak historii • start: ${s.reps?`${s.reps} powt.`:""}${s.seconds?`${s.seconds} s`:""}`;
 const l=perf.last;return `Ostatnio ${perf.log.date}: ${l.reps?`${l.reps} powt.`:""}${l.seconds?`${l.seconds} s`:""}${l.load?` • ${esc(l.load)}`:""} → cel: ${s.reps?`${s.reps} powt.`:""}${s.seconds?`${s.seconds} s`:""}${s.load?` • ${esc(s.load)}`:""}`;
}

const CALENDAR_TYPES={
 training:{icon:'🏋',label:'trening',actual:d=>completedTrainingsForDate(d)>0,plan:'planTraining'},
 measure:{icon:'📏',label:'pomiary',actual:d=>hasBodyMeasurement(d),plan:'planMeasure'},

};
function datesOfWeek(weekStart){return Array.from({length:7},(_,i)=>addDaysIso(weekStart,i))}
function calendarWeekInfo(weekStart){
 const dates=datesOfWeek(weekStart),info={weekStart,weekEnd:dates[6],types:{}};
 Object.entries(CALENDAR_TYPES).forEach(([type,cfg])=>{
  const actual=dates.filter(cfg.actual),plans=cfg.plan?dates.filter(d=>!!calData()[d]?.[cfg.plan]):[];
  info.types[type]={actual,plans,representative:actual.length?actual[actual.length-1]:(plans[0]||''),planned:!actual.length&&!!plans.length};
 });
 return info;
}
function calendarMarkerMap(dates){
 const weeks=[...new Set(dates.map(d=>iso(mondayOf(d))))],map={};
 weeks.forEach(ws=>{
  const info=calendarWeekInfo(ws);
  Object.entries(info.types).forEach(([type,t])=>{if(!t.representative)return;(map[t.representative]||(map[t.representative]=[])).push({type,planned:t.planned,weekStart:ws})});
 });
 return {map,weeks:weeks.map(calendarWeekInfo)};
}

function mergeExerciseLibraryData(current,incoming){
 const out=cloneJson(Array.isArray(current)?current:[]);let added=0,updated=0,skipped=0;
 (incoming||[]).forEach(item=>{
  const found=out.find(x=>normalizeExerciseName(x.name)===normalizeExerciseName(item.name));
  if(!found){out.push(item);added++;return}
  const before=JSON.stringify(found);Object.assign(found,mergeObjFillMissing(found,item));
  if(JSON.stringify(found)===before)skipped++;else updated++;
 });

}
function mergeExerciseWorkoutData(current,incoming){
 const out=cloneJson(Array.isArray(current)?current:[]);let setsAdded=0,exercisesAdded=0,updated=0,skipped=0;
 (incoming||[]).forEach(day=>{
  let target=out.find(x=>normalizeExerciseName(x.name)===normalizeExerciseName(day.name));
  if(!target){out.push(day);setsAdded++;exercisesAdded+=(day.ex||[]).length;return}
  const beforeDay=JSON.stringify({notes:target.notes});target.notes=target.notes||day.notes||'';target.ex=Array.isArray(target.ex)?target.ex:[];
  if(JSON.stringify({notes:target.notes})!==beforeDay)updated++;
  (day.ex||[]).forEach(exr=>{
   const found=target.ex.find(x=>normalizeExerciseName(x.name)===normalizeExerciseName(exr.name));
   if(!found){target.ex.push(exr);exercisesAdded++;return}
   const before=JSON.stringify(found);Object.assign(found,mergeObjFillMissing(found,exr));
   if(JSON.stringify(found)===before)skipped++;else updated++;
  });
 });
 return {list:out,setsAdded,exercisesAdded,updated,skipped};
}
function mergeExerciseWorkoutLogs(current,incoming){
 const out=cloneJson(Array.isArray(current)?current:[]);let added=0,updated=0,skipped=0;
 (incoming||[]).forEach(log=>{
  const found=out.find(x=>sameWorkoutLog(x,log));
  if(!found){out.push(log);added++;return}
  const existingResults=Array.isArray(found.setResults)?found.setResults:[];let changed=false;
  (log.setResults||[]).forEach(result=>{
   const duplicate=existingResults.some(x=>normalizeExerciseName(x.exerciseName)===normalizeExerciseName(result.exerciseName)&&Number(x.set||0)===Number(result.set||0));
   if(!duplicate){existingResults.push(result);changed=true}
  });
  found.setResults=existingResults;
  if(!found.note&&log.note){found.note=log.note;changed=true}
  if(changed)updated++;else skipped++;
 });
 return {list:out,added,updated,skipped};
}

/* ===== Blokada dostępu aplikacji =====
   Pierwsze uruchomienie wymaga ustalonego hasła właściciela.
   Jawne hasło nie jest zapisane w plikach. Statyczna aplikacja zawiera wyłącznie
   sól i weryfikator PBKDF2 potrzebny do lokalnego sprawdzenia hasła. */
const APP_AUTH_CONFIG_KEY="forma_pro_auth_config_v2";
const APP_AUTH_PBKDF2_ITERATIONS=310000;
const APP_AUTH_FIXED_SALT="WpJ/Jl8o6+dM9+g6sifA/Q==";
const APP_AUTH_FIXED_VERIFIER="DCUGUSIbgPdQd7XuSh6PTWvHr5J12aYbwpQP+eLmAEE=";
const APP_AUTH_MOBILE_TRUST_KEY="forma_pro_mobile_verified_v2";
const APP_AUTH_DESKTOP_IDLE_MS=5*60*1000;
let formaAuthIsPhone=false;
let formaAuthUnlocked=false;
let formaAuthBootstrapped=false;
let formaAuthListenersReady=false;
let formaAuthLastActivity=0;
let formaAuthIdleTimer=null;

function isFormaPhone(){
 const ua=navigator.userAgent||"";
 const mobileUa=/iPhone|iPod|Android.*Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(ua);
 const narrowScreen=Math.min(screen.width||innerWidth,screen.height||innerHeight)<=900;
 return mobileUa&&narrowScreen;
}
function bytesFromBase64(value){
 const raw=atob(value);
 return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
function base64FromBytes(bytes){
 let raw="";
 bytes.forEach(b=>raw+=String.fromCharCode(b));
 return btoa(raw);
}
function getFormaAuthConfig(){
 return {salt:APP_AUTH_FIXED_SALT,verifier:APP_AUTH_FIXED_VERIFIER,iterations:APP_AUTH_PBKDF2_ITERATIONS,fixed:true};
}
function createFormaAuthSalt(){
 if(!window.crypto?.getRandomValues)throw new Error("Ta przeglądarka nie obsługuje bezpiecznego generatora losowego.");
 const salt=new Uint8Array(16);
 crypto.getRandomValues(salt);
 return base64FromBytes(salt);
}
async function deriveFormaPasswordVerifier(value,saltB64,iterations=APP_AUTH_PBKDF2_ITERATIONS){
 if(!window.crypto?.subtle)throw new Error("Ta przeglądarka nie obsługuje bezpiecznej weryfikacji hasła.");
 const keyMaterial=await crypto.subtle.importKey(
  "raw",new TextEncoder().encode(value),"PBKDF2",false,["deriveBits"]
 );
 const bits=await crypto.subtle.deriveBits({
  name:"PBKDF2",salt:bytesFromBase64(saltB64),iterations,hash:"SHA-256"
 },keyMaterial,256);
 return base64FromBytes(new Uint8Array(bits));
}
function secureVerifierEqual(a,b){
 if(typeof a!=="string"||typeof b!=="string"||a.length!==b.length)return false;
 let diff=0;
 for(let i=0;i<a.length;i++)diff|=a.charCodeAt(i)^b.charCodeAt(i);
 return diff===0;
}
function setFormaAuthMessage(text,type=""){
 const el=document.getElementById("authMessage");
 if(!el)return;
 el.textContent=text||"";
 el.className="authMessage"+(type?" "+type:"");
}
function setFormaAuthScreen(reason=""){
 const desc=document.getElementById("authDescription");
 const rule=document.getElementById("authRule");
 const confirmWrap=document.getElementById("appAuthConfirmWrap");
 const input=document.getElementById("appAuthPassword");
 const confirm=document.getElementById("appAuthPasswordConfirm");
 const button=document.getElementById("appAuthButton");
 confirmWrap?.classList.add("hidden");
 if(confirm)confirm.value="";
 if(input){input.autocomplete="current-password";input.placeholder="Wpisz hasło"}
 if(button)button.textContent="Odblokuj aplikację";
 if(formaAuthIsPhone){
  if(desc)desc.textContent="Pierwsze uruchomienie na tym telefonie wymaga Twojego hasła.";
  if(rule)rule.textContent="Po poprawnym zalogowaniu telefon zostanie zapamiętany. Hasło nie będzie wymagane przy kolejnych uruchomieniach na tym urządzeniu.";
 }else{
  if(desc)desc.textContent=reason||"Wprowadź swoje hasło, aby uruchomić aplikację.";
  if(rule)rule.textContent="Na komputerze hasło jest wymagane przy każdym uruchomieniu. Po 5 minutach bezczynności aplikacja zostanie automatycznie zablokowana.";
 }
 requestAnimationFrame(()=>input?.focus());
}
function startFormaDesktopIdleTimer(){
 if(formaAuthIsPhone||!formaAuthUnlocked)return;
 formaAuthLastActivity=Date.now();
 clearTimeout(formaAuthIdleTimer);
 formaAuthIdleTimer=setTimeout(checkFormaDesktopIdle,APP_AUTH_DESKTOP_IDLE_MS+100);
 if(!formaAuthListenersReady){
  formaAuthListenersReady=true;
  ["pointerdown","keydown","touchstart","scroll"].forEach(name=>document.addEventListener(name,noteFormaDesktopActivity,{passive:true,capture:true}));
  document.addEventListener("mousemove",noteFormaDesktopActivity,{passive:true,capture:true});
  document.addEventListener("visibilitychange",()=>{
   if(document.visibilityState==="visible"&&formaAuthUnlocked&&!formaAuthIsPhone)checkFormaDesktopIdle();
  },{passive:true});
 }
}
function noteFormaDesktopActivity(){
 if(formaAuthIsPhone||!formaAuthUnlocked)return;
 const now=Date.now();
 if(now-formaAuthLastActivity<750)return;
 formaAuthLastActivity=now;
 clearTimeout(formaAuthIdleTimer);
 formaAuthIdleTimer=setTimeout(checkFormaDesktopIdle,APP_AUTH_DESKTOP_IDLE_MS+100);
}
function checkFormaDesktopIdle(){
 if(formaAuthIsPhone||!formaAuthUnlocked)return;
 if(window.isWorkoutPlayerActive?.()){
  formaAuthLastActivity=Date.now();
  clearTimeout(formaAuthIdleTimer);
  formaAuthIdleTimer=setTimeout(checkFormaDesktopIdle,APP_AUTH_DESKTOP_IDLE_MS+100);
  return;
 }
 const remaining=APP_AUTH_DESKTOP_IDLE_MS-(Date.now()-formaAuthLastActivity);
 if(remaining<=0){lockFormaPro("Wylogowano po 5 minutach bezczynności.");return}
 clearTimeout(formaAuthIdleTimer);
 formaAuthIdleTimer=setTimeout(checkFormaDesktopIdle,remaining+100);
}
function lockFormaPro(reason="Aplikacja została zablokowana."){
 if(formaAuthIsPhone)return;
 formaAuthUnlocked=false;
 clearTimeout(formaAuthIdleTimer);
 document.body.classList.add("auth-locked");
 const input=document.getElementById("appAuthPassword");
 if(input)input.value="";
 setFormaAuthScreen(reason);
 setFormaAuthMessage(reason,"error");
}
async function unlockFormaPro(rememberPhone=false){
 formaAuthUnlocked=true;
 if(formaAuthIsPhone&&rememberPhone)localStorage.setItem(APP_AUTH_MOBILE_TRUST_KEY,"1");
 document.body.classList.remove("auth-locked");
 setFormaAuthMessage("","");
 if(!formaAuthBootstrapped){
  formaAuthBootstrapped=true;
  await bootstrapFormaPro();
 }
 if(!formaAuthIsPhone)startFormaDesktopIdleTimer();
}
async function authenticateFormaPro(event){
 event?.preventDefault();
 const input=document.getElementById("appAuthPassword");
 const button=document.getElementById("appAuthButton");
 const value=input?.value||"";
 const cfg=getFormaAuthConfig();
 if(!value){setFormaAuthMessage("Wpisz hasło.","error");input?.focus();return false}
 if(button)button.disabled=true;
 try{
  const digest=await deriveFormaPasswordVerifier(value,cfg.salt,cfg.iterations);
  if(!secureVerifierEqual(digest,cfg.verifier)){
   setFormaAuthMessage("Nieprawidłowe hasło.","error");
   if(input){input.value="";input.focus()}
   return false;
  }
  if(input)input.value="";
  setFormaAuthMessage("Hasło poprawne.","ok");
  await unlockFormaPro(formaAuthIsPhone);
  return true;
 }catch(error){
  console.error("Błąd zabezpieczenia aplikacji:",error);
  setFormaAuthMessage("Nie udało się sprawdzić hasła w tej przeglądarce.","error");
  return false;
 }finally{if(button)button.disabled=false}
}
async function startFormaProWithAuthentication(){
 formaAuthIsPhone=isFormaPhone();
 const cfg=getFormaAuthConfig();
 if(cfg&&formaAuthIsPhone&&localStorage.getItem(APP_AUTH_MOBILE_TRUST_KEY)==="1"){
  await unlockFormaPro(false);
  return;
 }
 setFormaAuthScreen();
}

<script>
// ===== Forma PRO — stabilna instalacja PWA =====
let deferredInstallPrompt = null;
const installAppBtn = document.getElementById("installAppBtn");

function isStandaloneMode(){
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.navigator.standalone === true;
}

if(installAppBtn && isStandaloneMode()){
  installAppBtn.hidden = true;
}

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if(installAppBtn) installAppBtn.hidden = false;
});

if(installAppBtn){
  installAppBtn.addEventListener("click", async () => {
    if(!deferredInstallPrompt) return;

    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice.catch(() => null);

    deferredInstallPrompt = null;
    installAppBtn.hidden = true;
  });
}

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  if(installAppBtn) installAppBtn.hidden = true;
});

if("serviceWorker" in navigator){
  window.addEventListener("load", async () => {
    try{
      const registration = await navigator.serviceWorker.register("./service-worker.js", {
        scope: "./",
        updateViaCache: "none"
      });

      await registration.update();

      if(registration.waiting){
        registration.waiting.postMessage({type: "SKIP_WAITING"});
      }
    }catch(error){
      console.error("Nie udało się uruchomić service workera:", error);
    }
  });
}
</script>

function formaSeriesFactor(setNo,totalSets){

 return {
  reps:baseReps?Math.max(1,Math.round(baseReps*factor)):'',

exerciseTargetForSet=window.exerciseTargetForSet=function exerciseTargetForSetV184(exr,setNo){
 const sets=Math.max(1,Number(exr?.sets||1));
 const fixed=formaV184IsLastSeriesOnlyExercise(exr)||(typeof formaV183IsFixedTargetExercise==='function'&&formaV183IsFixedTargetExercise(exr));
 const factor=fixed?1:formaSeriesFactor(setNo,sets);
 const suggested=typeof exerciseSuggestion==='function'?exerciseSuggestion(exr):{};
 const baseReps=Number(exr?.reps||suggested.reps||0),baseSeconds=Number(exr?.seconds||suggested.seconds||0);
 return {
  reps:baseReps?(fixed?formaV183Even(baseReps):formaV183EvenRepsForSet(baseReps,setNo,sets)):'',
  seconds:baseSeconds?(fixed?formaRoundTime(baseSeconds):formaRoundTime(baseSeconds*factor)):'',
  load:suggested.load||'',factor,fixed
 };
};

cleanupExpiredPlans=window.cleanupExpiredPlans=function cleanupExpiredPlansV184(){
 let c=calData(),today=iso(),changed=false,missedInjection=false;
 Object.entries(PLAN_FIELDS).forEach(([type,field])=>{
  Object.keys(c).sort().forEach(date=>{
   if(date<today&&c[date]?.[field]&&!actualForPlanType(type,date)){
    delete c[date][field];changed=true;
    if(type==='injection')missedInjection=true;
   }
  });
  if(type==='injection'&&missedInjection){
   Object.keys(c).forEach(date=>{
    if(date>=today&&c[date]?.[field]){delete c[date][field];changed=true}
   });
  }else{
   const future=Object.keys(c).filter(date=>date>=today&&c[date]?.[field]).sort();
   future.slice(1).forEach(date=>{delete c[date][field];changed=true});
  }
 });
 if(changed)jset(KEYS.calendar,pruneEmptyCalendar(c));
 const carry=planCarry();
 if(missedInjection&&carry.injection)delete carry.injection;
 if(Object.keys(carry).length)jset(KEYS.calendarPlanCarry,carry);else jset(KEYS.calendarPlanCarry,{});
};

function formaV184SaveDayActivity(date){
 const all=data(),old=dayEntry(date);
 all[date]={
  ...old,
  steps:String(document.getElementById('edSteps')?.value||'').trim(),
  treadmillMin:String(document.getElementById('edTreadmill')?.value||'').trim(),
  gymMin:String(document.getElementById('edGym')?.value||'').trim(),
  note:String(document.getElementById('edDayNote')?.value||'').trim()
 };
 if(!Object.values(all[date]).some(v=>String(v??'').trim()!==''))delete all[date];
 jset(KEYS.data,all);
}

function formaV184AddManualWorkout(date){
 const name=String(document.getElementById('edManualWorkoutName')?.value||'').trim()||'Trening ręczny';
 const minutes=Math.max(0,Number(document.getElementById('edManualWorkoutMinutes')?.value||0));
 const note=String(document.getElementById('edManualWorkoutNote')?.value||'').trim();
 const log=workoutLog();
 log.push({
  id:uid('manual_workout'),date,workout:name,workoutId:'manual',
  note,partial:false,durationSeconds:minutes?Math.round(minutes*60):0,
  createdAt:new Date().toISOString(),manual:true
 });
 saveWorkoutLog(log);
 completeRecurringTask('training',date,false);
 render();
 setTimeout(()=>editDay(date),0);
}

function formaV184RemoveManualWorkout(id,date){
 if(!confirm('Usunąć ten ręczny wpis treningu?'))return;
 saveWorkoutLog(workoutLog().filter(x=>String(x.id)!==String(id)));
 render();
 setTimeout(()=>editDay(date),0);
}

    <div><label>Kroki</label><input id="edSteps" type="number" min="0" value="${esc(e.steps||'')}" placeholder="np. 8500"></div>
    <div><label>Bieżnia — min</label><input id="edTreadmill" type="number" min="0" value="${esc(e.treadmillMin||'')}" placeholder="np. 40"></div>
    <div><label>Siłownia / ćwiczenia — min</label><input id="edGym" type="number" min="0" value="${esc(e.gymMin||'')}" placeholder="np. 30"></div>
    <div class="full"><label>Notatka dnia</label><textarea id="edDayNote" placeholder="Dowolny ręczny wpis">${esc(e.note||'')}</textarea></div>

  <div class="calendarSection">

   <div>${logHtml}</div>
  </div>

  <div class="calendarSection">
   <h3>Oznaczenia</h3>

   <small class="calendarHint">Jeżeli zaplanowana iniekcja minie bez oznaczenia wykonania, jej ikona zniknie z tego dnia i wszystkie kolejne zaplanowane iniekcje zostaną anulowane. Nowy cykl możesz rozpocząć, zaznaczając kolejny termin ręcznie.</small>
  </div>

  <div class="actionRow">
   <button class="primary" onclick="saveDayFlags('${date}')">Zapisz dzień</button>

saveDayFlags=window.saveDayFlags=function saveDayFlagsV184(date){
 const old=calData()[date]||{};
 const duty=!!document.getElementById('edDuty')?.checked;
 const training=!!document.getElementById('edTraining')?.checked;
 const injection=!!document.getElementById('edInjection')?.checked;
 const injectionNote=String(document.getElementById('edInjectionNote')?.value||'').trim();
 formaV184SaveDayActivity(date);

 let c=calData();
 c[date]={...old,duty,training,injection,injectionNote};
 jset(KEYS.calendar,pruneEmptyCalendar(c));

 if(old.injection&&!injection)clearPlansFrom('injection',date);

 setPlanForDate('training',date,!!document.getElementById('edPlanTraining')?.checked);
 setPlanForDate('measure',date,!!document.getElementById('edPlanMeasure')?.checked);
 setPlanForDate('photo',date,!!document.getElementById('edPlanPhoto')?.checked);
 setPlanForDate('injection',date,!!document.getElementById('edPlanInjection')?.checked);

 if(training&&!old.training)completeRecurringTask('training',date,false);
 if(injection&&!old.injection)completeRecurringTask('injection',date,true);

 cleanupExpiredPlans();
 render();
 setTimeout(()=>editDay(date),0);
};

Object.assign(window,{
 cleanupExpiredPlans,editDay,saveDayFlags,circuitSteps,exerciseTargetForSet,
 formaV184AddManualWorkout,formaV184RemoveManualWorkout,formaV184IsLastSeriesOnlyExercise
});
</script>

<script id="forma-v185-series-rotation">
/* ===== Forma PRO v18.5 — ćwiczenia przypisane do konkretnej serii ===== */
function formaV185SeriesOnly(exr){
 const raw=Number(exr?.seriesOnly||exr?.onlySeries||0);
 return Number.isFinite(raw)&&raw>=1?Math.round(raw):0;
}

circuitSteps=window.circuitSteps=function circuitStepsV185(){
 const cur=todayWorkout(),exs=cur?.ex||[];let steps=[];
 const maxSets=Math.max(1,...exs.map(e=>Math.max(Number(e.sets||1),formaV185SeriesOnly(e))));
 for(let s=1;s<=maxSets;s++){
  exs.forEach((e,i)=>{
   const only=formaV185SeriesOnly(e);
   if(only){if(s===only)steps.push({set:s,idx:i,e});return;}
   if(typeof formaV184IsLastSeriesOnlyExercise==='function'&&formaV184IsLastSeriesOnlyExercise(e)){
    if(s===maxSets)steps.push({set:s,idx:i,e});
    return;
   }
   if(Number(e.sets||1)>=s)steps.push({set:s,idx:i,e});
  });
 }
 return steps;
};

exerciseTargetForSet=window.exerciseTargetForSet=function exerciseTargetForSetV185(exr,setNo){
 const sets=Math.max(1,Number(exr?.sets||1));
 const only=formaV185SeriesOnly(exr);
 const fixed=!!only||(typeof formaV184IsLastSeriesOnlyExercise==='function'&&formaV184IsLastSeriesOnlyExercise(exr))||(typeof formaV183IsFixedTargetExercise==='function'&&formaV183IsFixedTargetExercise(exr));
 const factor=fixed?1:formaSeriesFactor(setNo,sets);
 const suggested=typeof exerciseSuggestion==='function'?exerciseSuggestion(exr):{};
 const baseReps=Number(exr?.reps||suggested.reps||0),baseSeconds=Number(exr?.seconds||suggested.seconds||0);
 return {
  reps:baseReps?(fixed?formaV183Even(baseReps):formaV183EvenRepsForSet(baseReps,setNo,sets)):'',
  seconds:baseSeconds?(fixed?formaRoundTime(baseSeconds):formaRoundTime(baseSeconds*factor)):'',
  load:suggested.load||'',factor,fixed,seriesOnly:only
 };
};

Object.assign(window,{circuitSteps,exerciseTargetForSet,formaV185SeriesOnly});
</script>
